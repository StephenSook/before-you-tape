<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Page not found | Before You Tape</title>
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("/fonts/BricolageGrotesque/bricolage-grotesque-latin-wght-normal.woff2") format("woff2");
      font-weight: 200 800;
      font-display: swap;
    }
    @font-face {
      font-family: "Figtree";
      src: url("/fonts/Figtree/figtree-latin-wght-normal.woff2") format("woff2");
      font-weight: 300 900;
      font-display: swap;
    }
    :root { --paper: #fff3e6; --ink: #1d1712; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--paper); color: var(--ink);
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { padding: 24px 16px; max-width: 34rem; }
    h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 2rem; margin: 0 0 12px; }
    p { font-size: 1.125rem; margin: 0 0 20px; }
    a {
      display: inline-block; margin: 0 12px 12px 0; padding: 10px 18px;
      border: 1.5px solid var(--ink); border-radius: 24px; color: var(--ink);
      font-weight: 600; text-decoration: none;
    }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>No page lives at this address.</p>
    <a href="/">Pack a box</a>
    <a href="/judge">Judges: start here</a>
  </main>
</body>
</html>
