name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run, to save
# Actions minutes. Every main commit gets its own group, so a main run is never
# cancelled and each main SHA carries its own verdict.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Rule edition is up to date
        run: npm run edition:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Firestore rules tests (local emulator)
        # firebase-tools needs Java 21 or newer; the runner image ships one at JAVA_HOME_21_X64.
        run: |
          test -n "$JAVA_HOME_21_X64" || { echo "The runner has no Java 21."; exit 1; }
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          java -version
          npm run test:rules

      - name: Build
        run: npm run build

      - name: Build serves this commit
        run: |
          built=$(python3 -c "import json;print(json.load(open('dist/version.json'))['sha'])")
          head=$(git rev-parse HEAD)
          echo "version.json sha: $built"
          echo "HEAD:             $head"
          test "$built" = "$head"

      - name: Production build has no desk routes
        run: |
          if grep -l "/desk/" dist/assets/*.js; then
            echo "The desk routes reached the production bundle."
            exit 1
          fi

      - name: Tone check
        run: npm run tone

      - name: Model guard
        run: npm run guard

      - name: Public hygiene (reports while private, fails once public)
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: npm run hygiene

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -o pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          # Keep the release file name: the checksum list refers to it by that name.
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .

      - name: No co-author trailers in commit messages
        run: |
          if git log --format=%B | grep -i "co-authored-by"; then
            echo "A commit message carries a co-author trailer."
            exit 1
          fi
