name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run, to save
# Actions minutes. Every main commit gets its own group, so a main run is never
# cancelled and each main SHA carries its own verdict.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Rule edition is up to date
        run: npm run edition:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Firestore rules tests (local emulator)
        # firebase-tools needs Java 21 or newer; the runner image ships one at JAVA_HOME_21_X64.
        run: |
          test -n "$JAVA_HOME_21_X64" || { echo "The runner has no Java 21."; exit 1; }
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          java -version
          npm run test:rules

      # The public Firebase web config (it ships in every page anyway), so the built app starts as
      # it does live and the browser checks below can see its screens.
      - name: Build
        env:
          VITE_FB_API_KEY: ${{ vars.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ vars.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ vars.VITE_FB_PROJECT_ID }}
          VITE_FB_APP_ID: ${{ vars.VITE_FB_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          VITE_USE_EMULATORS: "false"
        run: npm run build

      - name: Build serves this commit
        run: |
          built=$(python3 -c "import json;print(json.load(open('dist/version.json'))['sha'])")
          head=$(git rev-parse HEAD)
          echo "version.json sha: $built"
          echo "HEAD:             $head"
          test "$built" = "$head"

      - name: Production build has no desk routes
        run: |
          if grep -l "/desk/" dist/assets/*.js; then
            echo "The desk routes reached the production bundle."
            exit 1
          fi

      # Only the browser itself: the runner image already has its system libraries, and the apt step behind
      # --with-deps hung three runs on 2026-11-18. The time limit stays, so any hang fails fast.
      - name: Install the test browser
        timeout-minutes: 6
        run: npx playwright install chromium

      # The built app in a real browser: it starts, every camera-stage control is readable, and /judge works
      # with no request to a Google API. These need no App Check token.
      - name: Browser checks on the built app
        run: npx playwright test --project=local tests/e2e/starts.spec.ts tests/e2e/contrast.spec.ts tests/e2e/judge.spec.ts

      - name: Tone check
        run: npm run tone

      - name: Model guard
        run: npm run guard

      - name: iOS model guard and its tests
        run: |
          python3 -I ios/scripts/test_ios_guard.py
          python3 -I ios/scripts/ios_guard.py .

      - name: iOS engine bundle is built from this commit's engine
        run: bash ios/scripts/check_engine_bundle.sh

      - name: Public hygiene (reports while private, fails once public)
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: npm run hygiene

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -o pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          # Keep the release file name: the checksum list refers to it by that name.
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .

      - name: No co-author trailers in commit messages
        run: |
          if git log --format=%B | grep -i "co-authored-by"; then
            echo "A commit message carries a co-author trailer."
            exit 1
          fi
