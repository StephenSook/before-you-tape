name: Android

# Expensive (Gradle): runs on pull requests to main and on main only, when the Android app, the
# web files its tests and engine bundle read, or this workflow change.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/engine/**"
      - "src/shared/**"
      - "src/embed/**"
      - "src/ai/prompts.ts"
      - "src/ui/ConsentNotice.tsx"
      - "src/ui/ReadFields.tsx"
      - "src/ui/categoryLabels.ts"
      - "rules/**"
      - "tests/vectors/**"
      - "tests/contracts/**"
      - "remoteconfig.template.json"
      - "scripts/build-embed.sh"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/engine/**"
      - "src/shared/**"
      - "src/embed/**"
      - "src/ai/prompts.ts"
      - "src/ui/ConsentNotice.tsx"
      - "src/ui/ReadFields.tsx"
      - "src/ui/categoryLabels.ts"
      - "rules/**"
      - "tests/vectors/**"
      - "tests/contracts/**"
      - "remoteconfig.template.json"
      - "scripts/build-embed.sh"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every main commit keeps its own run.
concurrency:
  group: android-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The engine bundle is built from the web repo with its own esbuild (node_modules).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Engine and app unit tests (shared vectors in QuickJS), lint and the debug build
        working-directory: android
        run: ./gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:compileDebugAndroidTestKotlin
      - name: Count unit tests (fails on fewer than 90, or on any failure or skip)
        run: python3 -I android/count-tests.py android/engine/build/test-results/test android/app/build/test-results/testDebugUnitTest --min 90
      - name: Lane guard
        run: bash android/guard.sh
