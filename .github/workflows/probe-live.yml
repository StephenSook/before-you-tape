name: Live probe

# Once a day through the judging window: the site serves main, the page loads, robots.txt and llms.txt
# are plain text, the models page still lists each allowed model with no shutdown before the window ends,
# AI Logic refuses a call with no App Check token, the app starts, and one real label photo is read in the
# cloud and judged. Only that last step uses a credential: the CI App Check debug token ("ci-2026-11",
# revoke by 2026-12-17), which the test fixtures put only into this app's own pages.
# The probe reports itself retired after 2026-12-17; delete this file then.
# A manual run can probe another site, so a wrong URL proves the probe fails.
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: Site to probe
        required: false
        default: https://before-you-tape-2026.web.app

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Probe
        env:
          PROBE_SITE: ${{ inputs.site }}
          # The public web key (it ships in every page); the call carries no App Check token and must be refused.
          PROBE_API_KEY: ${{ vars.VITE_FB_API_KEY }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          export MAIN_SHA
          npx tsx scripts/probe-live.ts

      - name: Install the test browser
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      # The fetch checks above cannot see a page that failed to start; this one opens it like a visitor.
      - name: The live app starts
        env:
          BYT_LIVE: "1"
          BYT_LIVE_URL: ${{ inputs.site }}
        run: npx playwright test --project=live tests/e2e/starts.spec.ts

      # One real model call a day: proves the read works end to end, not only that a call without a token is refused.
      - name: A real photo is read in the cloud
        env:
          BYT_LIVE: "1"
          BYT_LIVE_URL: ${{ inputs.site }}
          APPCHECK_DEBUG_TOKEN_CI: ${{ secrets.APPCHECK_DEBUG_TOKEN_CI }}
        run: npx playwright test --project=live tests/e2e/liveread.live.spec.ts
