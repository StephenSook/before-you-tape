name: Live probe

# Twice a day through the judging window, at two offset times, since GitHub delays and drops scheduled runs.
# The probe job, with no credential: the site serves main, the page
# loads, robots.txt and llms.txt are plain text, the models page still lists each allowed model with no
# shutdown before the window ends, AI Logic refuses a call with no App Check token, and the app starts.
# The read job, with the CI App Check debug token: one real read through the live app comes back as a read,
# once a UTC day. The fresh job fails when the scheduled run before this one started more than 36 hours ago.
# The probe reports itself retired after 2026-12-17; delete this file then.
# A manual run can probe another site, so a wrong URL proves the probe fails.
on:
  schedule:
    - cron: "23 13 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: Site to probe
        required: false
        default: https://before-you-tape-2026.web.app

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Probe
        env:
          PROBE_SITE: ${{ inputs.site }}
          # The public web key (it ships in every page); the call carries no App Check token and must be refused.
          PROBE_API_KEY: ${{ vars.VITE_FB_API_KEY }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          export MAIN_SHA
          npx tsx scripts/probe-live.ts

      - name: Install the test browser
        run: npx playwright install chromium

      # The fetch checks above cannot see a page that failed to start; this one opens it like a visitor.
      - name: The live app starts
        env:
          BYT_LIVE: "1"
          BYT_LIVE_URL: ${{ inputs.site }}
        run: npx playwright test --project=live tests/e2e/starts.spec.ts

  # A cron is no liveness guarantee: this fails when the scheduled run before this one started more than 36
  # hours ago, so a long silence shows red on the next run. It counts runs of any result, because a failed run
  # is already red, and counting only passing ones would keep this red after one bad day. It cannot alarm when
  # no run starts at all.
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: The scheduled run before this one started under 36 hours ago
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run ids only grow, so the newest run with a smaller id is the one before this; a newer queued run is
          # skipped. Its start time, not its creation time, is when it ran.
          last=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/probe-live.yml/runs" -f event=schedule -f per_page=20 \
            --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }})][0] | (.run_started_at // .created_at) // empty')
          if [ -z "$last" ]; then echo "No earlier scheduled run found"; exit 1; fi
          hours=$(python3 -c 'import sys, datetime as d; t = d.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); print(int((d.datetime.now(d.timezone.utc) - t).total_seconds() // 3600))' "$last")
          echo "The scheduled run before this one started at $last, $hours hours ago"
          if [ "$hours" -ge 36 ]; then echo "::error::No scheduled run started for $hours hours"; exit 1; fi

  # One real read through the live app's cloud path, with the CI App Check debug token: the reply must parse
  # as a complete read (tests/e2e/read.live.spec.ts). A paused API, a refused token or a quota error fails it,
  # and so does a missing token, so this job is never green without a real read. One read a day (the app may
  # retry once or try its fallback model on an error): a scheduled run skips the read when a scheduled run
  # already passed this UTC day. Its own job, so the checks above keep their own verdict.
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # Retired with the probe after the judging window: no model calls and no token use after it. A scheduled
      # run also skips the read when a scheduled run already passed this UTC day.
      - name: Still in the judging window, and not read yet today
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261217 ]; then echo "open=false" >> "$GITHUB_OUTPUT"; echo "The live read retired after 2026-12-17."; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            passed=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/probe-live.yml/runs" -f event=schedule -f status=success \
              -f created=">=$(date -u +%Y-%m-%d)" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
            if [ "$passed" -gt 0 ]; then echo "open=false" >> "$GITHUB_OUTPUT"; echo "A scheduled run already passed today, read included."; exit 0; fi
          fi
          echo "open=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.window.outputs.open == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.window.outputs.open == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.window.outputs.open == 'true'
        timeout-minutes: 5
        run: npm ci

      - name: Install the test browser
        if: steps.window.outputs.open == 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # Always the production site: a manual run's site input applies to the credential-free job only, so the
      # token is never used against, and the read never passes on, another site.
      - name: One real read on the live site
        if: steps.window.outputs.open == 'true'
        timeout-minutes: 4
        env:
          BYT_LIVE: "1"
          APPCHECK_DEBUG_TOKEN_CI: ${{ secrets.APPCHECK_DEBUG_TOKEN_CI }}
        # The token reaches only this app's pages (token-origin), and one real read comes back as a read.
        run: npx playwright test --project=live tests/e2e/token-origin.spec.ts tests/e2e/read.live.spec.ts
