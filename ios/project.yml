# XcodeGen spec for the iPhone client. Generate with:
#   xcodegen generate --spec ios/project.yml
# The generated BYT.xcodeproj is not tracked; this file is the source. Only the app's package pins
# are: BYT.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved, which XcodeGen keeps.
name: BYT
options:
  bundleIdPrefix: app.beforeyoutape
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    # The Apple developer team that signs device builds; App Attest in Firebase is registered
    # for this team. Simulator builds sign ad hoc so the test bundle loads.
    DEVELOPMENT_TEAM: Y8XVCMLQCZ
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
  BYTCore:
    path: BYTCore
targets:
  BYT:
    type: application
    platform: iOS
    sources:
      - path: BYT
      # The rule edition the box's verdicts come from: the repo's own file, bundled as is.
      - path: ../rules/edition.json
        buildPhase: resources
    info:
      path: BYT/Info.plist
      properties:
        CFBundleDisplayName: Before You Tape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        NSCameraUsageDescription: Used to photograph an item's label so the app can check it.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: BYT/BYT.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beforeyoutape.reader
        TARGETED_DEVICE_FAMILY: "1"
        # The app icon: BYT/Assets.xcassets/AppIcon.appiconset, one 1024 by 1024 opaque PNG drawn from
        # the web app's public/favicon.svg (rsvg-convert at 640 px, centered on #fff3e6, as the web
        # app's maskable icon). The asset catalog names it in the built Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: BYTCore
        product: BYTCore
  BYTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BYTTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beforeyoutape.reader.tests
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    dependencies:
      - target: BYT
  BYTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BYTUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beforeyoutape.reader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BYT
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    dependencies:
      - target: BYT
schemes:
  BYT:
    build:
      targets:
        BYT: all
    test:
      targets:
        - BYTTests
        - BYTUITests
