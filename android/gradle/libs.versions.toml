[versions]
agp = "9.5.1"
kotlin = "2.4.21"
# KSP2 versions are independent of Kotlin; firebase-ai-ksp-processor 17.0.0 needs symbol-processing-api 2.3.6 or later.
ksp = "2.3.14"
googleServices = "4.6.0"
crashlyticsPlugin = "3.0.8"
firebaseBom = "35.2.0"
# Pinned exactly; firebase-bom 35.2.0 carries the same firebase-ai.
firebaseAi = "18.2.0"
firebaseAiOndevice = "16.0.0-beta08"
firebaseAiKsp = "17.0.0"
coroutines = "1.10.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
junit = "4.13.2"
serializationJson = "1.8.1"
# Tests run the rules bundle in QuickJS on the JVM through Zipline (its JVM artifact carries macOS arm64 and Linux x64 hosts).
zipline = "1.28.0"

[libraries]
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-ai = { module = "com.google.firebase:firebase-ai", version.ref = "firebaseAi" }
firebase-ai-ondevice = { module = "com.google.firebase:firebase-ai-ondevice", version.ref = "firebaseAiOndevice" }
firebase-ai-ksp-processor = { module = "com.google.firebase:firebase-ai-ksp-processor", version.ref = "firebaseAiKsp" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-appcheck-debug = { module = "com.google.firebase:firebase-appcheck-debug" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-config = { module = "com.google.firebase:firebase-config" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
junit = { module = "junit:junit", version.ref = "junit" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
zipline = { module = "app.cash.zipline:zipline", version.ref = "zipline" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
